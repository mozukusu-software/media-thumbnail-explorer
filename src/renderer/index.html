<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' media-file: data:; media-src 'self' media-file:; style-src 'self'; script-src 'self'">
  <title>Media Thumbnail Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">M</span><span>Media Thumbnail Explorer</span></div>
    <input id="currentPath" class="current-path" type="text" value="" placeholder="フォルダを選択してください" aria-label="現在のフォルダーパス" spellcheck="false">
  </header>

  <main class="workspace">
    <aside class="folder-pane">
      <div class="pane-title"><span>フォルダー</span><button id="addNetworkRoot" class="pane-action" type="button" title="UNCパスを追加" aria-label="UNCパスを追加">＋ UNC</button></div>
      <div id="folderTree" class="folder-tree" role="tree" aria-label="フォルダーツリー"></div>
    </aside>

    <section class="file-pane">
      <div class="pane-title"><span>メディアファイル</span><span id="fileCount" class="count">0件</span></div>
      <div id="fileList" class="file-list"></div>
      <div id="fileEmpty" class="empty-state">左のツリーからフォルダを選択してください</div>
    </section>

    <section class="preview-pane">
      <div class="preview-toolbar">
        <div>
          <div class="pane-title no-border">プレビュー</div>
          <div id="selectedName" class="selected-name">ファイル未選択</div>
        </div>
        <label id="intervalControl" class="interval-control hidden">
          <span>サムネイル間隔</span>
          <select id="intervalSelect">
            <option value="10">10秒</option>
            <option value="20">20秒</option>
            <option value="30" selected>30秒</option>
            <option value="60">1分</option>
            <option value="600">10分</option>
            <option value="1800">30分</option>
          </select>
        </label>
      </div>
      <div id="previewContent" class="preview-content">
        <div class="preview-placeholder">画像または動画をクリックすると<br>ここに表示されます</div>
      </div>
    </section>
  </main>
  <div id="networkRootDialog" class="network-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="networkRootDialogTitle">
    <div class="network-dialog-card">
      <div id="networkRootDialogTitle" class="network-dialog-title">UNCパスを追加</div>
      <label class="network-dialog-label" for="networkRootInput">UNCパス</label>
      <input id="networkRootInput" class="network-dialog-input" type="text" placeholder="\\\\server\\share" spellcheck="false">
      <div id="networkRootError" class="network-dialog-error hidden"></div>
      <div class="network-dialog-actions">
        <button id="networkRootCancel" type="button">キャンセル</button>
        <button id="networkRootSubmit" type="button">追加</button>
      </div>
    </div>
  </div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-label="全画面画像ビューア">
    <button id="imageViewerClose" class="image-viewer-close" type="button" aria-label="閉じる">×</button>
    <img id="imageViewerImage" alt="">
    <div id="imageViewerName" class="image-viewer-name"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
